{% extends "base.html" %}
{% block content %}
<div class="flex flex-col items-center justify-center min-h-96 text-center">
    <div class="w-20 h-20 bg-blue-50 rounded-2xl flex items-center justify-center mb-6">
        <i class="{{ icon }} text-3xl text-blue-400"></i>
    </div>
    <h1 class="text-2xl font-bold text-gray-700">{{ title }}</h1>
    <p class="text-gray-400 mt-3 max-w-md leading-relaxed">{{ desc }}</p>
    <p class="text-sm text-blue-500 mt-6 flex items-center gap-2">
        <i class="fas fa-code"></i> Halaman ini sedang dalam pengembangan sprint berikutnya.
    </p>
</div>
{% endblock %}
