<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HR & People — Astacode ERP</title>
    <meta name="description" content="Modul HR Astacode ERP: absensi berbasis progres, rekrutmen, manajemen PKL, payroll, dan administrasi karyawan." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <!-- Flaticon UIcons (Regular Rounded) -->
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css" />
    <link rel="stylesheet" href="../sidebar.css" />
    <link rel="stylesheet" href="hr.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Lewati ke konten</a>

    <div class="app">
      <!-- Sidebar utama ERP (dirender oleh ../sidebar.js) -->
      <div id="sidebar-container" data-active-page="hr" data-active-subpage="beranda"></div>

      <main class="main" id="main" tabindex="-1">
        <!-- Topbar (selaras dengan modul lain) -->
        <header class="topbar">
          <div class="topbar-left">
            <button class="mobile-toggle icon-btn" id="mobileMenu" aria-label="Buka navigasi"><i class="fi-rr-menu-burger"></i></button>
            <nav class="breadcrumb" id="breadcrumb" aria-label="Breadcrumb"></nav>
          </div>
          <div class="top-actions">
            <button class="search-box" id="btnSearch" aria-label="Pencarian global (Ctrl+K)"><i class="fi-rr-search"></i><span>Cari karyawan, pelamar, PKL…</span><kbd>Ctrl K</kbd></button>
            <label class="sr-only" for="roleSelect">Peran (demo)</label>
            <select class="role-select" id="roleSelect" title="Ganti peran untuk simulasi hak akses">
              <option value="hr">HR Admin</option>
              <option value="manager">Manajer</option>
              <option value="employee">Karyawan</option>
              <option value="finance">Finance</option>
            </select>
            <button class="icon-btn" id="btnNotif" aria-label="Notifikasi"><i class="fi-rr-bell"></i><span class="badge-dot" id="notifDot"></span></button>
            <button class="user-profile" id="btnAvatar" aria-label="Profil pengguna">
              <div class="user-avatar" id="userAvatar">AS</div>
              <div class="user-info"><strong id="userName">Asisyah Sarah A.</strong><span id="userRole">HR Admin</span></div>
            </button>
          </div>
        </header>

        <!-- Sub-Navigation Bar (Quick Switcher) -->
        <div class="crm-subnav-bar" id="hrSubnavBar">
          <div class="crm-subnav-tabs" id="hrSubnav">
            <a href="#beranda" class="crm-subnav-item active" data-nav="beranda"><i class="fi-rr-home"></i> Beranda</a>
            <a href="#presensi" class="crm-subnav-item" data-nav="presensi"><i class="fi-rr-calendar-clock"></i> Presensi</a>
            <a href="#dailylog" class="crm-subnav-item" data-nav="dailylog"><i class="fi-rr-memo-pad"></i> Daily Log</a>
            <a href="#workload" class="crm-subnav-item" data-nav="workload"><i class="fi-rr-moon-stars"></i> Workload Malam</a>
            <a href="#rekap" class="crm-subnav-item" data-nav="rekap"><i class="fi-rr-users-alt"></i> Rekap Tim</a>
            <a href="#karyawan" class="crm-subnav-item" data-nav="karyawan"><i class="fi-rr-id-badge"></i> Data Karyawan</a>
            <a href="#lowongan" class="crm-subnav-item" data-nav="lowongan"><i class="fi-rr-briefcase"></i> Lowongan</a>
            <a href="#pipeline" class="crm-subnav-item" data-nav="pipeline"><i class="fi-rr-user-add"></i> Pipeline Pelamar</a>
            <a href="#pengajuan" class="crm-subnav-item" data-nav="pengajuan"><i class="fi-rr-graduation-cap"></i> Pengajuan PKL</a>
            <a href="#kalender" class="crm-subnav-item" data-nav="kalender"><i class="fi-rr-calendar"></i> Kalender Kuota</a>
            <a href="#peserta" class="crm-subnav-item" data-nav="peserta"><i class="fi-rr-users"></i> Peserta PKL</a>
            <a href="#laporan" class="crm-subnav-item" data-nav="laporan"><i class="fi-rr-document"></i> Laporan HR</a>
            <a href="#pengaturan" class="crm-subnav-item" data-nav="pengaturan"><i class="fi-rr-settings"></i> Pengaturan</a>
          </div>
          <span class="card-tag green" style="background:#DCFCE7; color:#16A34A; font-weight:700; font-size:11px; padding:3px 8px; border-radius:6px; display:inline-flex; align-items:center; gap:4px; white-space:nowrap;"><i class="fi-rr-check"></i> HR System Sync</span>
        </div>

        <div class="page-content">
          <div class="page-head">
            <div>
              <h1 id="pageTitle">Beranda</h1>
              <p id="pageSub"></p>
            </div>
            <div class="page-actions" id="pageActions"></div>
          </div>
          <div id="view" class="view"></div>
        </div>
      </main>
    </div>

    <!-- DRAWER -->
    <aside class="drawer" id="drawer" aria-hidden="true">
      <div class="drawer-head">
        <h2 id="drawerTitle">Detail</h2>
        <button class="icon-btn" id="drawerClose" aria-label="Tutup"><i class="fi-rr-cross-small"></i></button>
      </div>
      <div class="drawer-body" id="drawerBody"></div>
      <div class="drawer-foot" id="drawerFoot"></div>
    </aside>

    <!-- MODAL -->
    <div class="modal-wrap" id="modalWrap" aria-hidden="true">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-head">
          <h2 id="modalTitle">Modal</h2>
          <button class="icon-btn" id="modalClose" aria-label="Tutup"><i class="fi-rr-cross-small"></i></button>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-foot" id="modalFoot"></div>
      </div>
    </div>

    <!-- COMMAND PALETTE -->
    <div class="modal-wrap" id="cmdWrap" aria-hidden="true">
      <div class="cmd" role="dialog" aria-label="Command palette">
        <input id="cmdInput" placeholder="Ketik untuk mencari halaman atau data…" autocomplete="off" />
        <ul id="cmdList"></ul>
      </div>
    </div>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script src="../sidebar.js"></script>
    <script src="hr.js"></script>
  </body>
</html>
