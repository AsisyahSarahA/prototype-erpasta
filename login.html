<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login & Authentikasi — Astacode ERP</title>
  <meta name="description" content="Portal Login Astacode ERP V1 - Enterprise Operations Platform" />

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="login.css" />

  <!-- Auth Script (checks if already logged in) -->
  <script src="auth.js"></script>
</head>
<body>

  <!-- Ambient Light Effects -->
  <div class="bg-blur-1"></div>
  <div class="bg-blur-2"></div>

  <!-- Main Login Card -->
  <div class="login-container">
    
    <!-- Brand Header -->
    <div class="brand-header">
      <div class="brand-mark">
        <i class="fa-solid fa-layer-group"></i>
      </div>
      <div class="brand-title">
        ASTACODE ERP
        <span class="brand-badge">V1</span>
      </div>
      <div class="brand-subtitle">Enterprise Operations Platform • Unified Portal</div>
    </div>

    <!-- Alert / Validation Feedback -->
    <div id="authAlert" class="auth-alert">
      <i id="authAlertIcon" class="fa-solid fa-circle-exclamation"></i>
      <span id="authAlertMsg">Email atau kata sandi tidak valid.</span>
    </div>

    <!-- Login Form -->
    <form id="loginForm" onsubmit="handleLoginSubmit(event)" autocomplete="off">
      
      <!-- Email / Username Input -->
      <div class="form-group">
        <label class="form-label" for="loginEmail">Email / Username</label>
        <div class="input-wrapper">
          <input
            type="text"
            id="loginEmail"
            class="form-input"
            placeholder="nama@astacode.com"
            required
            autocomplete="username"
            value="admin@astacode.com"
          />
          <i class="fa-regular fa-envelope input-icon"></i>
        </div>
      </div>

      <!-- Password Input -->
      <div class="form-group">
        <label class="form-label" for="loginPassword">Kata Sandi</label>
        <div class="input-wrapper">
          <input
            type="password"
            id="loginPassword"
            class="form-input"
            placeholder="••••••••"
            required
            autocomplete="current-password"
            value="password"
          />
          <i class="fa-solid fa-lock input-icon"></i>
          <button type="button" class="toggle-password" id="togglePasswordBtn" onclick="togglePasswordVisibility()" title="Lihat kata sandi">
            <i class="fa-regular fa-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>

      <!-- Remember & Forgot Password -->
      <div class="form-row">
        <label class="remember-me">
          <input type="checkbox" id="rememberMe" checked />
          <span>Ingat sesi saya</span>
        </label>
        <a href="javascript:void(0)" onclick="handleForgotPassword()" class="forgot-link">Lupa kata sandi?</a>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submitBtn" class="btn-submit">
        <span>Masuk ke Dashboard</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>

      <!-- Quick Prototype Demo Access -->
      <div class="demo-box">
        <div class="demo-header">
          <span class="demo-title"><i class="fa-solid fa-bolt"></i> Prototype Auth Demo</span>
          <button type="button" class="quick-fill-btn" onclick="quickFillCredentials()">
            <i class="fa-solid fa-wand-magic-sparkles"></i> Auto-fill
          </button>
        </div>
        <div class="demo-desc">
          Gunakan kredensial demo apa saja, misal <code>admin@astacode.com</code> / password <code>password</code>.
        </div>
      </div>

    </form>

    <div class="login-footer">
      &copy; 2026 PT ASTACODE Solusindo Teknologi • All Rights Reserved
    </div>

  </div>

  <script src="login.js"></script>
</body>
</html>
